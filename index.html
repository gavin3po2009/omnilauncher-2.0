<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniLauncher v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar-item-active { background-color: #334155; border-left: 4px solid #3b82f6; }
        .app-card:hover { transform: translateY(-4px); }
        /* Custom scrollbar for runner */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- TOP NAV BAR -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-20 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-2 rounded-lg text-white shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-layer-group text-xl"></i>
            </div>
            <div class="flex items-baseline gap-2">
                <h1 class="text-2xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">OmniLauncher</h1>
                <span class="bg-blue-500/20 text-blue-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-blue-500/30">v2.0</span>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <!-- Search -->
            <div class="relative hidden sm:block">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search apps..." class="bg-slate-900 text-sm rounded-lg pl-9 pr-4 py-2 text-slate-200 border border-slate-700 focus:outline-none focus:border-blue-500 w-64 transition-colors">
            </div>

            <!-- Buttons -->
            <button id="addAppBtn" onclick="openModal()" class="hidden bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors flex items-center gap-2 shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-plus"></i> <span>Add App</span>
            </button>
            <button id="loginBtn" onclick="handleLogin()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-semibold px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
                <i class="fa-solid fa-lock"></i> <span>Owner Login</span>
            </button>
            <button id="logoutBtn" onclick="handleLogout()" class="hidden bg-red-500/10 hover:bg-red-500/20 text-red-400 text-sm font-semibold px-4 py-2 rounded-lg transition-colors border border-red-500/20">
                <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-800 border-r border-slate-700 p-4 hidden md:flex flex-col overflow-y-auto">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-2">Categories</div>
            <nav id="categoryNav" class="space-y-1">
                <!-- Categories injected by JS -->
            </nav>
        </aside>

        <!-- MAIN APP GRID -->
        <main class="flex-1 p-6 overflow-y-auto relative">
            <div id="errorBanner" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 p-4 rounded-lg mb-6 text-sm flex items-center gap-3">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="errorText">Error message goes here</span>
            </div>
            
            <div id="appsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-20">
                <!-- Apps injected by JS -->
            </div>
        </main>
    </div>

    <!-- APP RUNNER MODAL -->
    <div id="runnerModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col backdrop-blur-md">
        <div class="flex justify-between items-center p-3 border-b border-slate-800 bg-slate-900 text-white">
            <h3 class="text-lg font-bold flex items-center gap-3 px-2">
                <i id="runnerIcon" class="fa-solid fa-cube text-blue-400"></i> 
                <span id="runnerTitleText" class="tracking-wide">App Title</span>
            </h3>
            <button onclick="closeRunner()" class="bg-slate-800 hover:bg-red-500/20 text-slate-400 hover:text-red-400 h-8 w-8 rounded-full flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <iframe id="runnerIframe" class="w-full flex-1 bg-slate-950 border-none"></iframe>
    </div>

    <!-- ADD APP MODAL -->
    <div id="addModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm overflow-y-auto">
        <div class="bg-slate-800 border border-slate-600 rounded-xl p-6 w-full max-w-xl shadow-2xl my-8">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2 text-white border-b border-slate-700 pb-3">
                <i class="fa-solid fa-rocket text-blue-400"></i> Register New App
            </h2>
            <form id="appForm" onsubmit="saveApp(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wide">Title</label>
                        <input type="text" id="appTitle" required class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none rounded-lg p-2.5 text-sm text-white transition-all">
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wide">Category</label>
                        <input type="text" id="appCategory" placeholder="e.g. Utilities, Games" required class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none rounded-lg p-2.5 text-sm text-white transition-all">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wide">Icon Class (FontAwesome)</label>
                    <input type="text" id="appIcon" placeholder="fa-solid fa-gamepad" required class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none rounded-lg p-2.5 text-sm text-white transition-all">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wide">Description</label>
                    <textarea id="appDesc" rows="2" class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none rounded-lg p-2.5 text-sm text-white transition-all"></textarea>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wide">Source (HTML/JS or URL)</label>
                    <textarea id="appCode" rows="5" required placeholder="Paste complete HTML code or a https:// link..." class="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none rounded-lg p-3 text-sm text-green-400 font-mono transition-all"></textarea>
                </div>
                
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition-colors">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-bold shadow-lg shadow-blue-500/30 transition-all">Save & Deploy</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let apps = [];
        let isAdmin = false;
        let selectedCategory = 'all';

        function showError(msg) {
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorBanner').classList.remove('hidden');
            setTimeout(() => document.getElementById('errorBanner').classList.add('hidden'), 5000);
        }

        // ==========================================
        // BACKEND API INTEGRATION (Netlify Functions)
        // ==========================================

        async function checkSession() {
            try {
                const res = await fetch('/api/auth/session', { credentials: 'same-origin' });
                if (res.ok) {
                    const data = await res.json();
                    isAdmin = !!(data.loggedIn || data.isAdmin);
                }
            } catch (err) {
                console.log('Session check skipped or failed.');
            }
            updateAdminUI();
        }

        async function handleLogin() {
            const password = prompt("Enter Owner Password:");
            if (!password) return;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    isAdmin = true;
                    updateAdminUI();
                    renderApps();
                } else {
                    alert("Incorrect Password!");
                }
            } catch (err) {
                showError("Login failed. Make sure your Netlify backend functions are running.");
            }
        }

        async function handleLogout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
            } catch (e) {}
            isAdmin = false;
            updateAdminUI();
            renderApps();
        }

        function updateAdminUI() {
            document.getElementById('loginBtn').classList.toggle('hidden', isAdmin);
            document.getElementById('logoutBtn').classList.toggle('hidden', !isAdmin);
            document.getElementById('addAppBtn').classList.toggle('hidden', !isAdmin);
        }

        async function fetchApps() {
            try {
                const res = await fetch('/api/apps', { credentials: 'same-origin' });
                if (res.ok) {
                    apps = await res.json();
                    renderCategories();
                    renderApps();
                } else {
                    showError("Could not load apps from database.");
                }
            } catch (err) {
                showError("Could not connect to database backend.");
            }
        }

        async function saveApp(e) {
            e.preventDefault();
            const appData = {
                title: document.getElementById('appTitle').value,
                category: document.getElementById('appCategory').value,
                icon: document.getElementById('appIcon').value,
                description: document.getElementById('appDesc').value,
                code: document.getElementById('appCode').value
            };

            try {
                const res = await fetch('/api/apps', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(appData)
                });

                if (res.ok) {
                    closeModal();
                    document.getElementById('appForm').reset();
                    await fetchApps();
                } else {
                    alert("Failed to save app to database.");
                }
            } catch (err) {
                alert("Network error saving app.");
            }
        }

        async function deleteApp(id) {
            if (!confirm("Are you sure you want to delete this app forever?")) return;
            try {
                const res = await fetch(`/api/apps/${id}`, { method: 'DELETE', credentials: 'same-origin' });
                if (res.ok) {
                    await fetchApps();
                } else {
                    alert("Failed to delete app.");
                }
            } catch (err) {
                alert("Network error deleting app.");
            }
        }

        // ==========================================
        // FRONTEND RENDERING LOGIC
        // ==========================================

        function renderCategories() {
            const cats = ['all', ...new Set(apps.map(a => a.category).filter(Boolean))];
            const nav = document.getElementById('categoryNav');
            
            nav.innerHTML = cats.map(c => `
                <button onclick="filterCategory('${c}')" class="sidebar-item ${selectedCategory === c ? 'sidebar-item-active text-white shadow-md' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700/50'} w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium flex items-center gap-3 transition-all mb-1">
                    <i class="fa-solid ${c === 'all' ? 'fa-layer-group' : 'fa-folder'} ${selectedCategory === c ? 'text-blue-400' : 'text-slate-500'}"></i> 
                    ${c.charAt(0).toUpperCase() + c.slice(1)}
                </button>
            `).join('');
        }

        function renderApps() {
            const grid = document.getElementById('appsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();

            const filtered = apps.filter(a => {
                const matchesCat = selectedCategory === 'all' || (a.category && a.category.toLowerCase() === selectedCategory.toLowerCase());
                const matchesSearch = (a.title && a.title.toLowerCase().includes(search)) || (a.description && a.description.toLowerCase().includes(search));
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-500">
                        <i class="fa-solid fa-box-open text-4xl mb-4 text-slate-700"></i>
                        <p>No apps found in this category.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map(app => `
                <div class="app-card bg-slate-800 border border-slate-700 hover:border-blue-500/50 rounded-xl p-5 flex flex-col justify-between transition-all shadow-lg hover:shadow-blue-500/10 h-full group">
                    <div>
                        <div class="flex items-start justify-between mb-4">
                            <div class="h-12 w-12 bg-slate-900 rounded-xl border border-slate-700 flex items-center justify-center text-blue-400 text-2xl shadow-inner group-hover:scale-110 transition-transform">
                                <i class="${app.icon || 'fa-solid fa-cube'}"></i>
                            </div>
                            ${isAdmin ? `
                                <button onclick="deleteApp('${app.id}')" class="text-slate-600 hover:text-red-400 hover:bg-red-500/10 h-8 w-8 rounded-lg flex items-center justify-center transition-all" title="Delete App">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            ` : ''}
                        </div>
                        <h3 class="font-bold text-lg text-white mb-2 leading-tight">${app.title || 'Untitled App'}</h3>
                        <span class="text-[10px] uppercase font-bold text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded border border-indigo-500/20 mb-3 inline-block">${app.category || 'Uncategorized'}</span>
                        <p class="text-slate-400 text-sm leading-relaxed line-clamp-3">${app.description || ''}</p>
                    </div>
                    <button onclick="launchApp('${app.id}')" class="mt-5 w-full bg-slate-700/50 hover:bg-blue-600 text-white font-medium py-2.5 rounded-lg text-sm transition-all flex items-center justify-center gap-2 group-hover:shadow-lg group-hover:shadow-blue-500/20">
                        <i class="fa-solid fa-play text-xs"></i> Launch
                    </button>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            renderCategories();
            renderApps();
        }

        function handleSearch() {
            renderApps();
        }

        // ==========================================
        // APP LAUNCHER ENGINE
        // ==========================================

        function launchApp(id) {
            const app = apps.find(a => String(a.id) === String(id));
            if (!app) return;

            const modal = document.getElementById('runnerModal');
            const iframe = document.getElementById('runnerIframe');
            
            document.getElementById('runnerTitleText').textContent = app.title;
            document.getElementById('runnerIcon').className = app.icon || 'fa-solid fa-cube text-blue-400';

            const codeStr = app.code ? app.code.trim() : "";
            
            // Check if code is a URL or raw HTML
            if (codeStr.startsWith('http://') || codeStr.startsWith('https://') || codeStr.startsWith('./')) {
                iframe.src = codeStr;
            } else {
                iframe.srcdoc = codeStr;
            }

            modal.classList.remove('hidden');
        }

        function closeRunner() {
            document.getElementById('runnerModal').classList.add('hidden');
            document.getElementById('runnerIframe').src = 'about:blank';
            document.getElementById('runnerIframe').removeAttribute('srcdoc');
        }

        function openModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('addModal').classList.add('hidden'); }

        // Initialize App
        document.addEventListener('DOMContentLoaded', async () => {
            renderCategories(); // Render empty state
            await checkSession();
            await fetchApps();
        });
    </script>
</body>
</html>
